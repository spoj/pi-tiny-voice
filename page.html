<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>pi voice</title>
<style>
	:root { /*theme*/ }
	body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; background: Canvas; color: var(--text); font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
	#log { flex: 1; }
	:where(#log > *) { margin: 1lh 0; padding: 0 1ch; }
	.user, .tool, .custom { padding: 1lh 1ch; }
	.user { background: var(--userMessageBg); color: var(--userMessageText); }
	.tool { background: var(--toolPendingBg); white-space: pre-wrap; }
	.tool.success { background: var(--toolSuccessBg); }
	.tool.error { background: var(--toolErrorBg); }
	.tool > b { color: var(--toolTitle); }
	.out { color: var(--toolOutput); margin-top: 1lh; }
	.add { color: var(--toolDiffAdded); }
	.del { color: var(--toolDiffRemoved); }
	.accent { color: var(--accent); }
	.muted, .voice { color: var(--muted); }
	.thinking { color: var(--thinkingText); font-style: italic; }
	.custom { background: var(--customMessageBg); color: var(--customMessageText); }
	.trace { padding: 0 0 0 1ch; }
	.trace:not(.trace + .trace)::before { content: "› "; color: var(--dim); }
	.trace > b { font-weight: normal; cursor: pointer; color: var(--accent); }
	.trace:has(> .success) > b { color: var(--success); }
	.trace:has(> .error) > b { color: var(--error); }
	.trace:has(> .thinking) > b { color: var(--thinkingText); }
	.trace:has(> .custom) > b { color: var(--customMessageLabel); }
	.trace:not(.open) > div { display: none; }
	:where(.trace > div) { margin: 1lh 0; padding: 0 1ch; }
	.error { color: var(--error); }
	summary { cursor: pointer; }
	p, pre, ul, ol, blockquote, table, hr, h1, h2, h3, h4 { margin: 1lh 0; }
	:is(.md, .user, .custom, .thinking, blockquote, li) > :first-child { margin-top: 0; }
	:is(.md, .user, .custom, .thinking, blockquote, li) > :last-child { margin-bottom: 0; }
	p { white-space: pre-wrap; }
	h1, h2, h3, h4 { font-size: 1em; color: var(--mdHeading); }
	h1 { text-decoration: underline; }
	h3::before { content: "### "; }
	h4::before { content: "#### "; }
	a { color: var(--mdLink); }
	code { font: inherit; color: var(--mdCode); }
	pre { color: var(--mdCodeBlock); white-space: pre-wrap; }
	pre::before, pre::after { content: "```"; display: block; color: var(--mdCodeBlockBorder); }
	pre code { display: block; padding-left: 2ch; color: inherit; }
	blockquote { color: var(--mdQuote); font-style: italic; border-left: 1px solid var(--mdQuoteBorder); padding-left: 1ch; }
	hr { border: 0; border-top: 1px solid var(--mdHr); }
	ul { padding-left: 2ch; list-style: "- "; }
	ol { padding-left: 3ch; }
	li::marker { color: var(--mdListBullet); }
	table { border-collapse: collapse; }
	th, td { border: 1px solid var(--borderMuted); padding: 0 1ch; }
	img { display: block; max-width: 100%; }
	footer { position: sticky; bottom: 0; background: Canvas; border-top: 1px solid var(--border); padding: 1ch; }
	#busy { color: var(--accent); margin-bottom: 1ch; }
	button { width: 100%; padding: 1lh; font: inherit; font-size: 1.2em; color: var(--text); background: var(--userMessageBg); border: 1px solid var(--border); }
</style>
<div id="log"></div>
<footer>
	<div id="busy" hidden>Working...</div>
	<button id="toggle">Start</button>
</footer>
<script>
	let pc, dc, height = 0, delegation;
	// Turns since pi last got the user's words; `sent` is the user transcript pi already has.
	let turns = [];

	// Pi gets the user's words it doesn't have yet as the request, and the voice's finished turns as context.
	// With nothing new from the user, the delegation repeats one pi has: only pi's answer moves to it.
	function handoff() {
		const request = turns
			.filter((turn) => turn.user)
			.map((turn) => turn.said.startsWith(turn.sent) ? turn.said.slice(turn.sent.length).trim() : `Correction: ${turn.said.trim()}`)
			.filter(Boolean)
			.join("\n");
		const context = turns.filter((turn) => !turn.user && turn.done).map((turn) => `Voice: ${turn.said.trim()}`);
		fetch("delegate", { method: "POST", body: JSON.stringify({ id: delegation, request, turns: context }) })
			.then((response) => response.ok || Promise.reject())
			.catch(() => show("error", "Handoff failed. Repeat your request."));
		if (!request) return;
		for (const turn of turns) if (turn.user) turn.sent = turn.said;
		turns = turns.filter((turn) => !turn.done);
	}

	log.onclick = (e) => e.target.matches(".trace > b") && e.target.parentElement.classList.toggle("open");

	// Stay at the bottom while content arrives, unless the user scrolled up.
	new ResizeObserver(() => {
		if (scrollY + innerHeight >= height - 20) scrollTo(0, document.body.scrollHeight);
		height = document.body.scrollHeight;
	}).observe(document.body);

	function show(kind, text) {
		const line = document.createElement("p");
		line.className = kind;
		line.textContent = text;
		log.append(line);
	}

	const events = new EventSource("events");
	events.onopen = () => (log.innerHTML = "");
	events.addEventListener("show", (e) => {
		const { html, into, status } = JSON.parse(e.data);
		const box = into ? document.getElementById(into) : log;
		if (status) box.className = `tool ${status}`;
		box.insertAdjacentHTML("beforeend", html);
	});
	events.addEventListener("voice", (e) => {
		if (dc?.readyState === "open") for (const append of JSON.parse(e.data)) dc.send(JSON.stringify(append));
	});
	events.addEventListener("busy", (e) => (busy.hidden = !JSON.parse(e.data)));
	events.addEventListener("end", () => {
		events.close();
		stop();
		toggle.disabled = true;
		toggle.textContent = "Ended";
	});

	async function start() {
		toggle.textContent = "Connecting…";
		const connection = (pc = new RTCPeerConnection());
		const mic = await navigator.mediaDevices.getUserMedia({
			audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
		});
		// Stop was pressed while the browser asked for the microphone.
		if (pc !== connection) return mic.getTracks().forEach((track) => track.stop());
		pc.addTrack(mic.getTracks()[0]);
		const speaker = new Audio();
		speaker.autoplay = true;
		pc.ontrack = (e) => (speaker.srcObject = e.streams[0]);
		pc.onconnectionstatechange = () => pc?.connectionState === "failed" && stop();
		dc = pc.createDataChannel("oai-events");
		dc.onopen = () => (toggle.textContent = "Stop");
		dc.onmessage = (e) => {
			const event = JSON.parse(e.data);
			if (event.type === "turn.created")
				turns.push({ id: event.turn.id, user: event.turn.role === "user", said: event.turn.transcript, sent: "" });
			if (event.type === "turn.delta") turns.find((turn) => turn.id === event.turn_id).said += event.delta;
			if (event.type === "turn.done") {
				const turn = turns.find((turn) => turn.id === event.turn.id);
				turn.said = event.turn.transcript;
				turn.done = true;
				show("voice", `${turn.user ? "User" : "Voice"}: ${turn.said.trim()}`);
				// A finalized transcript may extend or correct an earlier handoff.
				if (turn.sent && turn.said !== turn.sent) handoff();
			}
			// Pi gets the user's words the moment the voice delegates, even mid-sentence.
			if (event.type === "delegation.created" && event.item.target === "client") {
				delegation = event.item.id;
				handoff();
			}
			if (event.type === "error") show("error", event.error.message);
		};
		await pc.setLocalDescription(await pc.createOffer());
		const answer = await fetch("call", { method: "POST", body: pc.localDescription.sdp });
		if (!answer.ok) throw new Error(await answer.text());
		await pc.setRemoteDescription({ type: "answer", sdp: await answer.text() });
	}

	function stop() {
		pc?.getSenders().forEach((sender) => sender.track?.stop());
		pc?.close();
		pc = dc = undefined;
		toggle.textContent = "Start";
	}

	toggle.onclick = () =>
		pc
			? stop()
			: start().catch((error) => {
					show("error", error.message);
					stop();
				});
</script>
